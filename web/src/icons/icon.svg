		<rect x="36" y="36" width="12" height="12" rx="2"/>
		<rect x="80" y="20" width="12" height="12" rx="2"/>
		<rect x="96" y="20" width="12" height="12" rx="2"/>
		<rect x="96" y="36" width="12" height="12" rx="2"/>
		<rect x="20" y="80" width="12" height="12" rx="2"/>
		<rect x="20" y="96" width="12" height="12" rx="2"/>
		<rect x="36" y="96" width="12" height="12" rx="2"/>
		<rect x="96" y="96" width="12" height="12" rx="2"/>
	</g>
