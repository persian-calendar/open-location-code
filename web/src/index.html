<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Geo Codes — Plus Codes &amp; H3</title>
	<meta name="description" content="Convert between Plus Codes and coordinates, or explore the same places as H3 cells, and see them on a map.">
	<link rel="canonical" href="https://persian-calendar.github.io/open-location-code/">
	<link rel="manifest" href="manifest.webmanifest">
	<meta name="theme-color" content="#e6e0f0" media="(prefers-color-scheme: light)">
	<meta name="theme-color" content="#16121f" media="(prefers-color-scheme: dark)">
	<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
	<link rel="icon" type="image/png" href="icons/icon-192.png">
	<link rel="apple-touch-icon" href="icons/icon-192.png">
	<style>
/* Violet for the page and orange for the mark it draws on the map, so the two read as one
   theme without the cell having to compete with the controls around it. */
:root {
	color-scheme: light dark;
	--surface: #ffffff;
	--control-hover: #e9dff8;
	--text: #241d33;
	--muted: #675d7d;
	--border: #e4dcf1;
	--accent: #6d28d9;
	--accent-hover: #5b21b6;
	--accent-ink: #ffffff;
	--accent-soft: #f2e9fe;
	--danger: #b42318;
	--marker: #ea580c;
	--marker-fill: rgba(234, 88, 12, .18);
	--map-bg: #e6e0f0;
	--pin-ring: #ffffff;
	--mono: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;

	/* The panel floats over the map, so it is a sheet of tinted glass rather than a card:
	   a translucent fill, a bright rim, and the tiles blurred underneath it. */
	--glass-fill: rgba(255, 255, 255, .58);
	--glass-fill-deep: rgba(255, 255, 255, .36);
	--glass-rim: rgba(255, 255, 255, .75);
	--glass-edge: rgba(255, 255, 255, .55);
	--glass-line: rgba(36, 22, 68, .12);
	--glass-sheen: rgba(255, 255, 255, .55);
	--glass-shadow: rgba(36, 22, 68, .3);
	--glass-field: rgba(255, 255, 255, .68);
	--glass-control: rgba(255, 255, 255, .45);
	--glass-thumb: rgba(255, 255, 255, .9);
	--sidebar-width: 23.5rem;
	--sheet-height: min(62vh, 34rem);
	--sheet-height: min(62dvh, 34rem);
}

@media (prefers-color-scheme: dark) {
	:root {
		--surface: #1c1729;
		--control-hover: #312745;
		--text: #eee9f8;
		--muted: #a89cbe;
		--border: #342b47;
		--accent: #b79bfb;
		--accent-hover: #c9b4fc;
		--accent-ink: #1b1033;
		--accent-soft: #2a2140;
		--danger: #ff7b72;
		--marker: #f6a464;
		--marker-fill: rgba(246, 164, 100, .22);
		--map-bg: #16121f;
		--pin-ring: #1c1729;

		--glass-fill: rgba(26, 20, 40, .64);
		--glass-fill-deep: rgba(19, 15, 31, .44);
		--glass-rim: rgba(255, 255, 255, .16);
		--glass-edge: rgba(255, 255, 255, .18);
		--glass-line: rgba(255, 255, 255, .1);
		--glass-sheen: rgba(255, 255, 255, .08);
		--glass-shadow: rgba(0, 0, 0, .6);
		--glass-field: rgba(12, 9, 21, .5);
		--glass-control: rgba(255, 255, 255, .08);
		--glass-thumb: rgba(255, 255, 255, .16);
		}
}

* { box-sizing: border-box; }

html,
body { height: 100%; }

/* The map is the page, so nothing here scrolls: the panel does. */
body {
	margin: 0;
	overflow: hidden;
	background: var(--map-bg);
	color: var(--text);
	font: 16px/1.6 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Ubuntu, sans-serif;
	-webkit-text-size-adjust: 100%;
}

h1 {
	margin: 0;
	font-size: 1.4rem;
	line-height: 1.2;
	letter-spacing: -.02em;
}

/* The panel: glass laid over the map, open at the left on a wide screen and along the
   bottom on a narrow one. Its header stays put and its body scrolls. */
.sidebar {
	position: fixed;
	z-index: 2;
	top: 1rem;
	bottom: 1rem;
	left: 1rem;
	width: var(--sidebar-width);
	display: flex;
	flex-direction: column;
	border: 1px solid var(--glass-edge);
	border-radius: 1.6rem;
	background:
		linear-gradient(150deg, var(--glass-sheen) 0%, transparent 42%),
		linear-gradient(180deg, var(--glass-fill), var(--glass-fill-deep));
	box-shadow:
		0 24px 60px -18px var(--glass-shadow),
		0 2px 10px rgba(20, 10, 40, .1),
		inset 0 1px 0 var(--glass-rim);
	color: var(--text);
	-webkit-backdrop-filter: blur(26px) saturate(180%);
	backdrop-filter: blur(26px) saturate(180%);
	transition: transform .5s cubic-bezier(.22, .9, .28, 1), opacity .35s;
}

/* A browser without a backdrop to blur would leave the tiles showing through the text. */
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
	.sidebar { background: var(--surface); }
	.sidebar__head { border-color: var(--border); }
}

body.is-sidebar-closed .sidebar {
	transform: translateX(calc(-100% - 1.5rem));
	opacity: 0;
	pointer-events: none;
}

.sidebar__grip { display: none; }

.sidebar__head {
	flex: none;
	display: flex;
	align-items: flex-start;
	gap: .75rem;
	padding: 1.35rem 1.35rem 1rem;
	border-bottom: 1px solid var(--glass-line);
}

.sidebar__head > div { flex: 1 1 auto; min-width: 0; }

.sidebar__head p {
	margin: .4rem 0 0;
	color: var(--muted);
	font-size: .8rem;
	line-height: 1.45;
}

.sidebar__close {
	flex: none;
	width: 2rem;
	height: 2rem;
	margin: -.15rem -.2rem 0 0;
	padding: 0;
	display: grid;
	place-items: center;
	border: 1px solid var(--glass-line);
	border-radius: 50%;
	background: var(--glass-control);
	color: var(--text);
	cursor: pointer;
}

.sidebar__close:hover { background: var(--control-hover); }

/* The two formats in one track, with a thumb that slides to the choice. */
.modes {
	flex: none;
	position: relative;
	display: grid;
	grid-template-columns: 1fr 1fr;
	margin: .9rem 1.1rem 0;
	padding: .2rem;
	border: 1px solid var(--glass-line);
	border-radius: 999px;
	background: var(--glass-control);
}

.modes__thumb {
	position: absolute;
	top: .2rem;
	bottom: .2rem;
	left: .2rem;
	width: calc(50% - .2rem);
	border-radius: 999px;
	background: var(--glass-thumb);
	box-shadow:
		0 1px 2px rgba(20, 10, 40, .16),
		inset 0 1px 0 var(--glass-rim);
	transition: transform .32s cubic-bezier(.22, .9, .28, 1);
}

.modes[data-mode="h3"] .modes__thumb { transform: translateX(100%); }

.modes__option {
	position: relative;
	z-index: 1;
	padding: .42rem .5rem;
	border: 0;
	border-radius: 999px;
	background: none;
	color: var(--muted);
	font-size: .82rem;
	font-weight: 600;
	line-height: 1.4;
	cursor: pointer;
	transition: color .2s;
}

.modes__option[aria-checked="true"] { color: var(--text); }

/* The generic button hover would paint a block inside the track. */
.modes__option:hover {
	background: none;
	color: var(--text);
}

.sidebar__body {
	flex: 1 1 auto;
	min-height: 0;
	overflow-y: auto;
	overscroll-behavior: contain;
	display: flex;
	flex-direction: column;
	gap: 1rem;
	padding: 1rem 1.1rem 1.1rem;
	scrollbar-width: thin;
	scrollbar-color: var(--border) transparent;
}

/* Shown where the panel is closed, to bring it back. */
.sidebar-open {
	position: fixed;
	z-index: 3;
	top: 1rem;
	left: 1rem;
	display: flex;
	align-items: center;
	gap: .45rem;
	padding: .5rem .9rem .5rem .7rem;
	border: 1px solid var(--glass-edge);
	border-radius: 999px;
	background: var(--glass-fill);
	box-shadow:
		0 12px 30px -12px var(--glass-shadow),
		inset 0 1px 0 var(--glass-rim);
	-webkit-backdrop-filter: blur(18px) saturate(180%);
	backdrop-filter: blur(18px) saturate(180%);
	color: var(--text);
	cursor: pointer;
}

.sidebar-open:hover { background: var(--control-hover); }

.sidebar-open svg {
	width: 1.05rem;
	height: 1.05rem;
	opacity: .75;
}

.panel {
	display: flex;
	flex-direction: column;
	gap: .8rem;
}

.options {
	display: grid;
	grid-template-columns: repeat(2, minmax(0, 1fr));
	gap: .75rem;
}

label {
	display: flex;
	flex-direction: column;
	gap: .3rem;
	min-width: 0;
	font-size: .8rem;
	font-weight: 600;
	color: var(--muted);
}

@media (max-width: 26rem) {
	.options { grid-template-columns: minmax(0, 1fr); }
}

/* One height for both, set outright: a select and an input do not size themselves alike
   from the same padding, and a row of them should line up. */
input,
select {
	width: 100%;
	height: 2.6rem;
	padding: 0 .65rem;
	border: 1px solid var(--border);
	border-radius: .55rem;
	background: var(--glass-field);
	color: var(--text);
	font: inherit;
	font-size: .95rem;
}

select { cursor: pointer; }

#code {
	font-family: var(--mono);
	font-size: 1.05rem;
	letter-spacing: .06em;
}

/* Fifteen hex digits: a little tighter than a Plus Code, which has a plus in it. */
#h3 {
	font-family: var(--mono);
	font-size: .95rem;
	letter-spacing: .01em;
}

#latitude,
#longitude { font-family: var(--mono); }

input:focus-visible,
select:focus-visible,
button:focus-visible,
.map:focus-visible,
.share__label a:focus-visible {
	outline: 2px solid var(--accent);
	outline-offset: 1px;
}

/* Empty unless there is something to say, so it takes no room when there is not. */
.status {
	margin: 0;
	color: var(--muted);
	font-size: .8rem;
}

.status.is-error { color: var(--danger); }

/* Chips: as wide as the name in them, laid out until the row runs out. */
.examples {
	display: flex;
	flex-wrap: wrap;
	gap: .4rem;
}

.examples button {
	flex: 0 0 auto;
	padding: .3rem .75rem;
	border: 1px solid var(--glass-line);
	border-radius: 999px;
	background: var(--glass-control);
	color: var(--text);
	font-size: .8rem;
	cursor: pointer;
	transition: background .15s, border-color .15s;
}

.examples button:hover {
	border-color: var(--marker);
	background: var(--control-hover);
}

/* The map: the whole window, with tiles placed by transforms inside it and the code's cell
   and centre drawn on top in screen space. The panel and the chips float over it. */
.map {
	position: fixed;
	z-index: 0;
	inset: 0;
	overflow: hidden;
	background: var(--map-bg);
	touch-action: none;
	cursor: grab;
}

.map.is-dragging { cursor: grabbing; }

.map__tiles img {
	position: absolute;
	top: 0;
	left: 0;
	width: 256px;
	height: 256px;
	opacity: 0;
	transition: opacity .25s ease-out;
	user-select: none;
	-webkit-user-drag: none;
	will-change: transform;
	/* Between levels a tile is scaled, so it has to grow from its own corner. */
	transform-origin: 0 0;
}

.map__tiles img.is-loaded { opacity: 1; }

@media (prefers-color-scheme: dark) {
	/* The public tiles come in one palette; on a dark page they are turned over and drained
	   of their colour rather than left as a bright rectangle in the middle of it. Turning
	   them over alone leaves the land a muddy brown, so the colour goes with it. */
	.map__tiles img {
		filter: invert(1) hue-rotate(180deg) saturate(0) brightness(.95);
	}
}

/* The H3 cell, drawn in the same screen space as the Plus Code rectangle. */
.map__h3 {
	position: absolute;
	inset: 0;
	width: 100%;
	height: 100%;
	overflow: visible;
	pointer-events: none;
}

.map__h3 path {
	fill: var(--marker-fill);
	stroke: var(--marker);
	stroke-width: 2;
	stroke-linejoin: round;
}

.map__cell {
	position: absolute;
	border: 2px solid var(--marker);
	border-radius: 2px;
	background: var(--marker-fill);
	box-shadow: 0 0 0 1px rgba(255, 255, 255, .45);
	pointer-events: none;
}

.map__pin {
	position: absolute;
	width: .8rem;
	height: .8rem;
	border: 2px solid var(--pin-ring);
	border-radius: 50%;
	background: var(--marker);
	box-shadow: 0 1px 4px rgba(0, 0, 0, .45);
	transform: translate(-50%, -50%);
	pointer-events: none;
}

.map__zoom {
	position: absolute;
	top: .75rem;
	right: .75rem;
	display: flex;
	flex-direction: column;
	gap: .3rem;
}

.map__zoom #find-code { margin-top: .35rem; }

.map__zoom button {
	flex: none;
	width: 2.15rem;
	height: 2.15rem;
	padding: 0;
	display: grid;
	place-items: center;
	border: 1px solid var(--glass-edge);
	border-radius: .6rem;
	background: var(--glass-fill);
	color: var(--text);
	font-size: 1.05rem;
	line-height: 1;
	cursor: pointer;
	box-shadow:
		0 8px 20px -10px var(--glass-shadow),
		inset 0 1px 0 var(--glass-rim);
	-webkit-backdrop-filter: blur(18px) saturate(180%);
	backdrop-filter: blur(18px) saturate(180%);
}

.map__zoom button:hover { background: var(--control-hover); }

/* Clear of the panel on a wide screen; the panel is the bottom sheet on a narrow one, and
   there the hint would only sit in the way. */
.map__hint {
	position: absolute;
	left: calc(var(--sidebar-width) + 2rem);
	bottom: 1.1rem;
	margin: 0;
	padding: .3rem .7rem;
	border: 1px solid var(--glass-edge);
	border-radius: 999px;
	background: var(--glass-fill);
	color: var(--muted);
	font-size: .72rem;
	box-shadow:
		0 8px 20px -10px var(--glass-shadow),
		inset 0 1px 0 var(--glass-rim);
	-webkit-backdrop-filter: blur(18px) saturate(180%);
	backdrop-filter: blur(18px) saturate(180%);
	pointer-events: none;
	transition: opacity .4s, left .5s cubic-bezier(.22, .9, .28, 1);
}

body.is-sidebar-closed .map__hint { left: 1.1rem; }

.map.is-used .map__hint { opacity: 0; }

/* Always on the map, over the panel's shoulder: the tiles are OpenStreetMap's. */
.attribution {
	position: fixed;
	z-index: 1;
	right: 1rem;
	bottom: 1rem;
	margin: 0;
	padding: .25rem .65rem;
	border: 1px solid var(--glass-edge);
	border-radius: 999px;
	background: var(--glass-fill);
	color: var(--muted);
	font-size: .68rem;
	box-shadow:
		0 8px 20px -10px var(--glass-shadow),
		inset 0 1px 0 var(--glass-rim);
	-webkit-backdrop-filter: blur(18px) saturate(180%);
	backdrop-filter: blur(18px) saturate(180%);
}

.attribution a { color: inherit; }

.facts {
	display: grid;
	grid-template-columns: repeat(auto-fit, minmax(8.5rem, 1fr));
	gap: .75rem 1rem;
	margin: 0;
}

.facts > div {
	display: flex;
	flex-direction: column;
	gap: .1rem;
	min-width: 0;
}

.facts dt {
	color: var(--muted);
	font-size: .72rem;
	font-weight: 600;
	text-transform: uppercase;
	letter-spacing: .06em;
}

.code-field {
	display: flex;
	flex-direction: column;
	gap: .3rem;
}

.code-field > label {
	color: var(--muted);
	font-size: .8rem;
	font-weight: 600;
}

/* The code and the precision that made it belong together: one is the other's size. */
.code-field__row {
	display: flex;
	gap: .5rem;
}

.code-field__row input {
	flex: 1 1 auto;
	min-width: 8rem;
}

/* The list of precisions is wider than a phone can spare beside the code, so there they
   take a row each and the code keeps its full width. */
.code-field__row select {
	flex: 0 0 auto;
	width: auto;
}

@media (max-width: 32rem) {
	.code-field__row {
		flex-direction: column;
	}

	.code-field__row select { width: 100%; }
}

/* A row is a flex box, so the attribute that hides one needs to win over that. */
[hidden] { display: none !important; }

.facts dd {
	margin: 0;
	font-family: var(--mono);
	font-size: .95rem;
	overflow-wrap: anywhere;
}

.facts dd.is-empty { color: var(--muted); }

/* The code, the link and the two addresses, shown rather than hidden behind a copy
   button: they are there to be read and taken. */
.share {
	display: flex;
	flex-direction: column;
	gap: .4rem;
}

.share__row {
	display: flex;
	align-items: center;
	gap: .6rem;
}

.share__label {
	flex: 0 0 4.5rem;
	color: var(--muted);
	font-size: .78rem;
	font-weight: 600;
	overflow-wrap: anywhere;
}

.share__label a { color: var(--accent); }

.share__row input {
	flex: 1 1 auto;
	min-width: 0;
	height: 2.2rem;
	font-family: var(--mono);
	font-size: .78rem;
}

button {
	padding: .45rem .9rem;
	border: 1px solid var(--glass-line);
	border-radius: .55rem;
	background: var(--glass-control);
	color: var(--text);
	font: inherit;
	font-size: .85rem;
	cursor: pointer;
	transition: background .15s, border-color .15s;
}

button:hover { background: var(--control-hover); }

@media (max-width: 30rem) {
	.share__row {
		flex-direction: column;
		align-items: stretch;
		gap: .15rem;
	}

	.share__label { flex: none; }
}

/* Narrow: the panel lies along the bottom, where a thumb can reach it, and the map stays
   clear above it. The grip says it is a sheet rather than a card. */
@media (max-width: 60rem) {
	.sidebar {
		top: auto;
		left: .6rem;
		right: .6rem;
		bottom: .6rem;
		width: auto;
		height: var(--sheet-height);
		border-radius: 1.4rem;
	}

	.sidebar__grip {
		display: block;
		flex: none;
		width: 2.5rem;
		height: .25rem;
		margin: .5rem auto 0;
		border-radius: 999px;
		background: var(--border);
	}

	.sidebar__head { padding: .8rem 1.1rem .85rem; }

	.modes { margin: .7rem .9rem 0; }

	/* The panel slides down here, so the chevron that points it away points down too. */
	.sidebar__close svg { transform: rotate(-90deg); }

	.sidebar__body { padding: .85rem .9rem 1rem; }

	body.is-sidebar-closed .sidebar {
		transform: translateY(calc(100% + 1.5rem));
	}

	/* Instructions are for a pointer; on a touch screen tapping the map is the obvious
	   thing to do, and the pill would only crowd the strip of map that is left. */
	.map__hint { display: none; }

	.attribution {
		right: .6rem;
		bottom: calc(var(--sheet-height) + 1.1rem);
	}

	body.is-sidebar-closed .attribution { bottom: 1.1rem; }

	.sidebar-open {
		top: auto;
		left: .6rem;
		bottom: 1.1rem;
	}
}

/* A landscape phone has no room for four lines of introduction above the fields. */
@media (max-width: 60rem) and (max-height: 24rem) {
	.sidebar__head { padding: .55rem 1.1rem .6rem; }

	.sidebar__head p { display: none; }

	.modes { margin-top: .5rem; }
}

/* Where the system asks for less transparency, the glass becomes a solid surface. */
@media (prefers-reduced-transparency: reduce) {
	.sidebar,
	.sidebar-open,
	.map__zoom button,
	.map__hint,
	.attribution {
		background: var(--surface);
		-webkit-backdrop-filter: none;
		backdrop-filter: none;
	}
}

@media (prefers-reduced-motion: reduce) {
	.map__tiles img,
	.map__hint,
	.sidebar,
	.modes__thumb,
	button,
	.examples button { transition: none; }
}
	</style>
</head>
<body>
	<!-- Outside the panel, so it can bring it back after it has slid away. -->
	<button class="sidebar-open" id="sidebar-open" type="button"
		aria-controls="sidebar" aria-expanded="false" hidden>
		<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
			stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
			<rect x="3" y="4" width="18" height="16" rx="3"/>
			<path d="M9 4v16"/>
		</svg>
		Details
	</button>

	<aside class="sidebar" id="sidebar" aria-label="Geo code details">
		<div class="sidebar__grip" aria-hidden="true"></div>
		<header class="sidebar__head">
			<div>
				<h1>Geo Codes</h1>
				<p>
					Two ways to name a place: a Plus Code, or an H3 cell.
					Converted and drawn entirely in your browser.
				</p>
			</div>
			<button class="sidebar__close" id="sidebar-close" type="button"
				aria-controls="sidebar" aria-expanded="true" aria-label="Hide the details panel">
				<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
					stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
					<path d="M15 5l-7 7 7 7"/>
				</svg>
			</button>
		</header>

		<div class="modes" id="modes" role="radiogroup" aria-label="Coordinate format" data-mode="plus">
			<span class="modes__thumb" aria-hidden="true"></span>
			<button class="modes__option" id="mode-plus" type="button" role="radio"
				aria-checked="true" tabindex="0">Plus Codes</button>
			<button class="modes__option" id="mode-h3" type="button" role="radio"
				aria-checked="false" tabindex="-1">H3</button>
		</div>

		<div class="sidebar__body">
			<div class="panel">
				<div class="code-field" id="plus-field">
					<label for="code">Plus code</label>
					<div class="code-field__row">
						<input id="code" type="text" dir="ltr" spellcheck="false" autocomplete="off"
							autocapitalize="characters" placeholder="849VCWC8+">
						<select id="digits" aria-label="How precise the code is"></select>
					</div>
				</div>
				<div class="code-field" id="h3-field" hidden>
					<label for="h3">H3 cell</label>
					<div class="code-field__row">
						<input id="h3" type="text" dir="ltr" spellcheck="false" autocomplete="off"
							autocapitalize="off" placeholder="8928308280fffff">
						<select id="resolution" aria-label="H3 resolution"></select>

				</div>
				<div class="options">
					<label for="latitude">
						<span>Latitude</span>
						<input id="latitude" type="text" inputmode="decimal" dir="ltr" autocomplete="off" spellcheck="false">
					</label>
					<label for="longitude">
						<span>Longitude</span>
						<input id="longitude" type="text" inputmode="decimal" dir="ltr" autocomplete="off" spellcheck="false">

				<p class="status" id="status" role="status" aria-live="polite"></p>
				<dl class="facts">
					<div>
						<dt id="fact-cell-label">Cell</dt>
						<dd id="cell-size">…</dd>
					</div>
					<div>
						<dt>Centre</dt>
						<dd id="centre">…</dd>
					</div>
				</dl>
				<div class="share">
					<div class="share__row" id="share-plus-row">
						<span class="share__label">plus.codes</span>
						<input id="share-plus-codes" type="text" dir="ltr" readonly aria-label="This code on plus.codes">
					</div>
					<div class="share__row" id="share-link-row">
						<span class="share__label">Link</span>
						<input id="share-link" type="text" dir="ltr" readonly aria-label="A link to this code">

					<div class="share__row">
						<span class="share__label">OSM</span>

					</div>

			</div>

			<div class="examples" id="examples" role="group" aria-label="Example places"></div>
		</div>
	</aside>

	<div class="map" id="map" tabindex="0" role="application"
		aria-label="Map showing the area the code covers. Click a place to read its code.">
		<div class="map__tiles" id="tiles"></div>
		<svg class="map__h3" id="h3-shape" hidden aria-hidden="true"><path id="h3-path"/></svg>
		<div class="map__cell" id="cell" hidden></div>
		<div class="map__pin" id="pin" hidden></div>
		<div class="map__zoom">
			<button id="zoom-in" type="button" aria-label="Zoom in">+</button>
			<button id="zoom-out" type="button" aria-label="Zoom out">−</button>
			<button id="find-code" type="button" aria-label="Centre the map on the code">
				<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
					stroke-width="2" stroke-linecap="round" aria-hidden="true">
					<circle cx="12" cy="12" r="6"/>
					<path d="M12 2v4M12 18v4M2 12h4M18 12h4"/>

	<script src="main.js"></script>
	<script>
		/*
		 * H3 is not part of the Plus Codes page: it is a separate bundle, and the dynamic
		 * import in main.js asks for it the first time the switch is used. Ask for it while
		 * the browser is idle instead of during the first paint, so the default page stays
		 * light and the switch is still instant when it is pressed. The service worker also
		 * precaches it, so a PWA install has it offline.
		 */
		const preloadH3 = () => {
			const link = document.createElement('link');
			link.rel = 'modulepreload';
			link.href = 'h3.js';
			document.head.append(link);
		};
		if ('requestIdleCallback' in window) {
			requestIdleCallback(preloadH3, { timeout: 2000 });
		} else {
			window.addEventListener('load', preloadH3, { once: true });
		}
	</script>
	<script>
		/*
		 * Offline support, and a page that does not go stale.
		 *
		 * The worker itself is the version marker: the build stamps a digest of the page into
		 * sw.js, so every deploy gives the browser a sw.js it has not seen, which installs a
		 * new worker, fills a new cache and drops the old one. The browser looks for that on
		 * its own when the page is opened; the timer and the visibility check below are for a
		 * page that is left open.
		 *
		 * When a new worker takes over a page that was already controlled, a new version is
		 * live, so the page reloads once to run it. The first install claims the page too, and
		 * there is nothing to refresh then.
		 *
		 * Not on a development server: a cached bundle there would keep serving stale files
		 * while the page is being worked on.
		 */
		if ('serviceWorker' in navigator &&
			location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
			var hadController = !!navigator.serviceWorker.controller;
			var reloading = false;
			navigator.serviceWorker.addEventListener('controllerchange', function () {
				if (!hadController || reloading) return;
				reloading = true;
				location.reload();
			});

			navigator.serviceWorker.register('sw.js').then(function (registration) {
				function checkForUpdate() {
					registration.update();
				}
				setInterval(checkForUpdate, 60 * 60 * 1000);
				document.addEventListener('visibilitychange', function () {
					if (document.visibilityState === 'visible') checkForUpdate();
				});
			});
		}
	</script>
</body>
